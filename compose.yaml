services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: scheduletask
      POSTGRES_DB: schedule_task
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scheduletask}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduletask -d schedule_task"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-scheduletask}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    environment:
      TZ: ${TZ:-UTC}
      SCHEDULETASK_POSTGRES_DSN: "host=postgres user=scheduletask password=${POSTGRES_PASSWORD:-scheduletask} dbname=schedule_task port=5432 sslmode=disable"
      SCHEDULETASK_REDIS_ADDR: redis:6379
      SCHEDULETASK_REDIS_PASSWORD: ${REDIS_PASSWORD:-scheduletask}
    ports:
      - "127.0.0.1:8082:8082"
      - "127.0.0.1:8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8082/readyz"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 20
    stop_grace_period: 20s
    restart: unless-stopped

  callback:
    image: python:3.13-alpine
    profiles: ["demo"]
    working_dir: /app
    command: ["python", "-u", "callback.py"]
    volumes:
      - ./examples/callback.py:/app/callback.py:ro

volumes:
  postgres-data:
  redis-data:
